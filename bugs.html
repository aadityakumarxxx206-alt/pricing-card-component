<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Registration</title>

    <link rel="stylesheet" href="bugs.css">
</head>

<body>

    <div class="container">

        <section class="left">
            <h1>Create Account</h1>

            <p>
                Join our platform and manage your account,
                profile and personal information from one place.
            </p>
        </section>

        <section class="right">

            <h2>Registration Form</h2>

            <form>

                <div class="form-row">

                    <div class="form-group">
                        <label for="first">First Name</label>
                        <input type="text" id="first" name="first" placeholder="First name">
                    </div>

                    <div class="form-group">
                        <label for="last">Last Name</label>
                        <input type="text" id="last" name="last" placeholder="Last name">
                    </div>

                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="example@email.com">
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="country">Country</label>

                        <select id="country">
                            <option>India</option>
                            <option>Japan</option>
                            <option>Germany</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" name="phone" placeholder="+91">
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>

                    <div class="form-group">
                        <label for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" name="confirm">
                    </div>

                </div>

                <div class="terms">

                    <input type="checkbox" id="agree">

                    <label for="agree">
                        I agree to the terms and conditions
                    </label>

                </div>

                <button class="submit" type="submit">
                    Create Account
                </button>

            </form>

        </section>

    </div>

</body>
</html>
