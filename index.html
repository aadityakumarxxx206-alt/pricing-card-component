<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <div class="logo">DevPortfolio</div>
    <nav>
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#skills">Skills</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>


  <main class="card-container">
    <div class="profile-card">
      <div class="image-box">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=500&q=80" alt="Profile Photo" class="profile-img">
      </div>
      
      <div class="profile-content">
        <span class="badge">Available for Work</span>
        <h1 class="name">Sanya Kapoor</h1>
        <p class="role">Frontend Developer & Designer</p>
        <p class="bio">
          Crafting clean, responsive, and high-performance websites. Passionate about modern web design and smooth user interfaces.
        </p>

        <div class="action-area">
          <button class="btn-primary">Connect With Me</button>
          <a href="#portfolio" class="link-secondary">View Work</a>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
